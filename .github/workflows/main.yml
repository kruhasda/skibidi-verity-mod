name: Build Fabric Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Prepare and Build Mod
        run: |
          BUILD_FILE=$(find . -name "build.gradle" | head -n 1)
          cd "$(dirname "$BUILD_FILE")"
          sed -i 's/FabricEntityTypeBuilder.create/FabricEntityTypeBuilder.<SkibidiVerityEntity>create/g' src/main/java/com/example/skibidiverity/SkibidiVerityMod.java
          sed -i 's/import com.example.skibidiverity.SkibidiVerityMod;/import com.example.skibidiverity.SkibidiVerityMod;\nimport com.example.skibidiverity.SkibidiVerityModClient;/g' src/main/java/com/example/skibidiverity/client/SkibidiVerityRenderer.java
          gradle build --no-daemon

      - name: Upload compiled Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: skibidi-verity-mod-1.20.1
          path: '**/build/libs/*.jar'
